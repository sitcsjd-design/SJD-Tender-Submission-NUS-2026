<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SJD Unified PSP / EAP / ERP Scenario Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f6f9; color: #1a2332; line-height: 1.45; }
  .header { background: #1F3864; color: white; padding: 20px 32px; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .layout { display: grid; grid-template-columns: 260px 1fr 300px; gap: 0; min-height: calc(100vh - 82px); }
  .sidebar { background: white; border-right: 1px solid #e1e5eb; padding: 20px 0; overflow-y: auto; }
  .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; padding: 0 20px 10px; font-weight: 600; }
  .scenario-group { margin-bottom: 18px; }
  .scenario-btn { display: block; width: 100%; text-align: left; padding: 10px 20px; background: none; border: none; border-left: 3px solid transparent; cursor: pointer; font-size: 13px; color: #1a2332; transition: all 0.15s; }
  .scenario-btn:hover { background: #f4f6f9; }
  .scenario-btn.active { background: #eef2f8; border-left-color: #1F3864; font-weight: 600; }
  .scenario-btn .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; font-weight: 600; }
  .tag.psp { background: #dbeafe; color: #1e40af; }
  .tag.eap { background: #fef3c7; color: #92400e; }
  .tag.erp { background: #fee2e2; color: #991b1b; }
  .main { padding: 24px 32px; overflow-y: auto; }
  .scenario-title { font-size: 20px; font-weight: 600; color: #1F3864; }
  .scenario-sub { font-size: 13px; color: #6b7280; margin-top: 4px; margin-bottom: 20px; }
  .anim-container { background: white; border: 1px solid #e1e5eb; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
  .anim-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .anim-title { font-size: 14px; font-weight: 600; color: #1F3864; }
  .anim-controls { display: flex; gap: 8px; align-items: center; }
  .anim-btn { padding: 6px 14px; background: #1F3864; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .anim-btn:hover { background: #2a4a7a; }
  .anim-btn.secondary { background: #e5e7eb; color: #1a2332; }
  .anim-controls select { padding: 6px; font-size: 12px; border-radius: 4px; border: 1px solid #d1d5db; }
  .anim-stage { position: relative; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; }
  .anim-stage svg { display: block; width: 100%; height: auto; }
  .clock-overlay { position: absolute; top: 10px; right: 12px; background: rgba(31, 56, 100, 0.95); color: white; padding: 6px 12px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.05em; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; padding: 8px 12px; background: #f8fafc; border-radius: 4px; font-size: 11px; }
  .legend-item { display: flex; align-items: center; gap: 4px; color: #4b5563; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid white; box-shadow: 0 0 0 1px #cbd5e1; }
  .kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .kpi-item { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 4px; padding: 8px 10px; font-size: 11px; }
  .kpi-item.hit { background: #d1fae5; border-color: #10b981; }
  .kpi-item-label { font-weight: 600; color: #1F3864; margin-bottom: 2px; }
  .kpi-item.hit .kpi-item-label { color: #065f46; }
  .anim-log { margin-top: 12px; background: #1a2332; color: #d1d5db; border-radius: 4px; padding: 10px 14px; font-family: 'Courier New', monospace; font-size: 11px; max-height: 120px; overflow-y: auto; }
  .anim-log .log-line { padding: 2px 0; }
  .anim-log .log-time { color: #60a5fa; font-weight: 700; margin-right: 8px; }
  .phase { margin-bottom: 22px; }
  .phase-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .phase-badge { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 3px; font-weight: 700; letter-spacing: 0.05em; }
  .phase-badge.psp { background: #1e40af; color: white; }
  .phase-badge.eap { background: #b45309; color: white; }
  .phase-badge.erp { background: #991b1b; color: white; }
  .phase-badge.post { background: #065f46; color: white; }
  .phase-title { font-size: 14px; font-weight: 600; }
  .lanes { display: grid; grid-template-columns: 120px 1fr; background: white; border: 1px solid #e1e5eb; border-radius: 6px; overflow: hidden; }
  .lane-role { padding: 12px; background: #f8fafc; border-right: 1px solid #e1e5eb; border-bottom: 1px solid #e1e5eb; font-size: 12px; font-weight: 600; color: #1F3864; display: flex; align-items: center; }
  .lane-actions { padding: 12px; border-bottom: 1px solid #e1e5eb; font-size: 13px; }
  .lane-role:last-of-type, .lane-actions:last-of-type { border-bottom: none; }
  .lane-actions ol { padding-left: 18px; }
  .lane-actions li { margin-bottom: 4px; }
  .aside { background: #fafbfc; border-left: 1px solid #e1e5eb; padding: 20px; overflow-y: auto; }
  .aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; margin-bottom: 10px; font-weight: 600; }
  .aside-block { background: white; border: 1px solid #e1e5eb; border-radius: 6px; padding: 12px; margin-bottom: 14px; }
  .kpi-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px dashed #e1e5eb; }
  .kpi-row:last-child { border-bottom: none; }
  .kpi-label { color: #4b5563; }
  .kpi-value { font-weight: 600; color: #1F3864; }
  .equip-list { list-style: none; }
  .equip-list li { padding: 4px 0; font-size: 12px; color: #4b5563; }
  .equip-list li::before { content: "\25B8 "; color: #1F3864; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <h1>SJD Unified PSP / EAP / ERP Scenario Map</h1>
  <p>NUS Aquatic Facilities (USC &amp; UTown) &nbsp;·&nbsp; MSUM/SPORTS/T/2026/01 &nbsp;·&nbsp; SLG + LG IC + LG + CS baseline manning</p>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="scenario-group">
      <h2>Baseline</h2>
      <button class="scenario-btn active" data-scenario="psp">Routine Surveillance <span class="tag psp">PSP</span></button>
    </div>
    <div class="scenario-group">
      <h2>Aquatic Emergencies</h2>
      <button class="scenario-btn" data-scenario="active">Active Drowning <span class="tag erp">ERP</span></button>
      <button class="scenario-btn" data-scenario="passive">Passive / Submerged Victim <span class="tag erp">ERP</span></button>
      <button class="scenario-btn" data-scenario="swb">Shallow Water Blackout <span class="tag erp">ERP</span></button>
      <button class="scenario-btn" data-scenario="spinal">Suspected Spinal Injury <span class="tag erp">ERP</span></button>
      <button class="scenario-btn" data-scenario="cardiac">Cardiac Arrest on Deck <span class="tag erp">ERP</span></button>
    </div>
    <div class="scenario-group">
      <h2>Environmental</h2>
      <button class="scenario-btn" data-scenario="lightning">Lightning Alert <span class="tag eap">EAP</span></button>
      <button class="scenario-btn" data-scenario="chemical">Chemical / Water Quality <span class="tag eap">EAP</span></button>
      <button class="scenario-btn" data-scenario="fire">Fire / Evacuation <span class="tag eap">EAP</span></button>
    </div>
    <div class="scenario-group">
      <h2>Operational</h2>
      <button class="scenario-btn" data-scenario="missing">Missing Person Report <span class="tag eap">EAP</span></button>

    </div>
  </div>

  <div class="main" id="main"></div>
  <div class="aside" id="aside"></div>
</div>

<script>
// ===== ROLE DEFINITIONS =====
const ROLE = {
  SLG:  { color: '#1F3864', label: 'SLG',   font: 10, tc: 'white' },
  LGIC: { color: '#b91c1c', label: 'LG IC', font: 8,  tc: 'white' },
  LG:   { color: '#ea580c', label: 'LG',    font: 10, tc: 'white' },
  CS:   { color: '#7c3aed', label: 'CS',    font: 10, tc: 'white' },
  V:    { color: '#facc15', label: 'V',     font: 11, tc: '#1a2332' },
  P:    { color: '#64748b', label: 'P',     font: 11, tc: 'white' },
  P2:   { color: '#94a3b8', label: 'P',     font: 11, tc: 'white' }
};

// ===== SCENARIO PHASES (SWIM LANES) =====
const scenarios = {
  psp: { title: "Routine Pool Surveillance Procedure", sub: "Baseline vigilance protocol under the 10/20 scanning standard. All scenarios branch from this state.",
    phases: [
      { type: "psp", title: "Continuous Surveillance", lanes: [
        { role: "LG (on chair)", actions: ["Sweep designated zone within 10 seconds using RID scan (Recognise, Identify, Decide)", "Reach any distressed swimmer within 20 seconds of recognition", "Rescue tube worn at all times, whistle accessible"] },
        { role: "LG IC (patrol)", actions: ["15-minute patrol of pool perimeter with rescue tube", "Monitor blind spots and glare zones during rotation", "Silent signal handover on rotation change"] },
        { role: "SLG", actions: ["Verify staffing per shift (SLG or LG IC as team lead + 2 LGs + 1 CS)", "Rotate LGs on 20 to 30 minute cycles to preserve scan span", "Log water quality checks (3 times daily)"] },
        { role: "Counter Staff", actions: ["Monitor entry and enforce Code of Practice signage", "Hold LG mobile devices during on-post periods", "Radio check every hour"] }
      ]},
      { type: "psp", title: "Preventive Intervention (KPI 3a)", lanes: [
        { role: "Any LG", actions: ["Issue verbal warning for running, breath-hold games, or lane rope misuse", "Log intervention in daily activity register", "Escalate to LG IC or SLG if patron non-compliant"] }
      ]}
    ]},
  active: { title: "Active Drowning (Distressed Swimmer)", sub: "Victim conscious, vertical in water, silent struggle, unable to call for help. Recognition window under 20 seconds.",
    phases: [
      { type: "eap", title: "Recognition &amp; Activation", lanes: [
        { role: "LG (on chair)", actions: ["Recognise distress signs within 10 second scan cycle", "Single long whistle blast, point at victim, signal LG IC", "Enter water with rescue tube within 20 seconds"] }
      ]},
      { type: "erp", title: "Rescue Execution", lanes: [
        { role: "LG (rescuer)", actions: ["Approach with rescue tube extended, verbal reassurance", "Contact tow to nearest exit point", "Assess for secondary drowning symptoms on deck"] },
        { role: "LG IC", actions: ["Clear affected pool immediately, three short whistle blasts", "Position at pool edge to assist extrication", "Retrieve first aid kit if secondary assessment required"] },
        { role: "Counter Staff", actions: ["Close pool admission, note time of incident", "Standby to contact NUS Security if condition deteriorates"] },
        { role: "SLG", actions: ["Direct scene, ensure crowd control", "Assess victim, decide on ambulance escalation"] }
      ]},
      { type: "post", title: "Post-Incident", lanes: [ { role: "LG IC", actions: ["Complete Appendix C Incident Report within shift", "Debrief team, review scan pattern that identified victim", "Submit report to NUS/MSUM within 24 hours"] } ] }
    ]},
  passive: { title: "Passive Drowning / Submerged Victim", sub: "Victim unconscious, submerged, no visible struggle. Recognition must occur within the 30-second awareness standard (KPI 1a).",
    phases: [
      { type: "eap", title: "Recognition &amp; Activation", lanes: [
        { role: "LG (on chair)", actions: ["Identify submerged silhouette within 30 second scan", "Three long whistle blasts, point down at victim", "Immediate entry, controlled descent to victim"] }
      ]},
      { type: "erp", title: "Rescue &amp; Extrication", lanes: [
        { role: "LG (rescuer)", actions: ["Surface with victim, tow to nearest edge", "Two-LG lift onto deck, move clear of pool", "Extricate within 90 seconds (KPI 2b)"] },
        { role: "LG IC", actions: ["Clear all bathers from all pools", "Retrieve softpack (AED, oxy-viva, BVM, spinal board)", "Assist two-LG lift, prepare deck for resuscitation"] },
        { role: "Counter Staff", actions: ["Call NUS Security (activate 995 ambulance)", "Alert MSUM duty officer", "Trace victim ID and belongings"] },
        { role: "SLG", actions: ["Take incident command", "Direct crowd control and pool clearance", "Coordinate ambulance ingress route"] }
      ]},
      { type: "erp", title: "Deck-Side Resuscitation", lanes: [
        { role: "LG (Rescuer 1)", actions: ["Primary survey: check responsiveness, airway, breathing", "Commence CPR within 30 sec of extrication (KPI 2c)", "30:2 compressions to ventilations, swap every 2 min"] },
        { role: "LG IC (Rescuer 2)", actions: ["Prepare AED while CPR continues", "Attach pads within 90 sec, deliver shock as advised", "Prepare BVM and oxygen after first shock cycle"] },
        { role: "Counter Staff", actions: ["Guide paramedics from gate to poolside", "Note ambulance number plate and destination hospital"] }
      ]},
      { type: "post", title: "Handover &amp; Post-Incident", lanes: [
        { role: "SLG / LG IC", actions: ["Handover to paramedics: shocks given, CPR duration, meds", "Retain AED analysis card for MSUM", "Complete Appendix C, replenish softpack consumables"] }
      ]}
    ]},
  swb: { title: "Shallow Water Blackout (SWB) / Samba", sub: "Hyperventilation-induced hypoxic blackout, typically freedive or breath-hold training. Victim slumps silently, often near pool bottom.",
    phases: [
      { type: "eap", title: "Pre-Incident Vigilance", lanes: [{ role: "LG (on chair)", actions: ["Flag any patron performing repeated breath-hold sets", "Enforce buddy system for freedive activity", "Intervene at first sign of loss of motor control (LMC / samba)"] }]},
      { type: "erp", title: "Rescue Execution", lanes: [
        { role: "LG (rescuer)", actions: ["Enter immediately, support head above water", "Blow across face to trigger breathing reflex if surface blackout", "Tow to nearest edge, maintain airway"] },
        { role: "LG IC", actions: ["Clear pool, retrieve oxy-viva and BVM from softpack", "Two-LG lift onto deck, move clear of pool"] },
        { role: "Counter Staff", actions: ["Standby for ambulance activation (mandatory for SWB)", "Log incident time and identify buddy / group lead"] }
      ]},
      { type: "erp", title: "On-Deck Management", lanes: [
        { role: "LG (rescuer)", actions: ["Recovery position if breathing", "Administer O2 via non-rebreather at 15 LPM", "Monitor for delayed pulmonary distress up to 4 hours"] },
        { role: "SLG", actions: ["Mandatory ambulance escalation (secondary drowning risk)", "Brief NUS/MSUM on activity context"] }
      ]},
      { type: "post", title: "Post-Incident", lanes: [ { role: "SLG / LG IC", actions: ["Appendix C with activity classification (freedive / breath-hold)", "Review whether activity should be permitted under standing PSP", "Update quarterly training brief"] } ] }
    ]},
  spinal: { title: "Suspected Spinal Injury", sub: "Trauma from diving, slip, or collision. Victim may be conscious. In-water stabilisation before extrication.",
    phases: [
      { type: "erp", title: "In-Water Stabilisation", lanes: [
        { role: "LG (rescuer)", actions: ["Approach without creating waves", "Vice grip or head splint technique to immobilise C-spine", "Hold position, do not rotate victim"] },
        { role: "LG IC", actions: ["Clear pool", "Retrieve spinal board and stiff neck collar", "Enter water to assist board slide"] }
      ]},
      { type: "erp", title: "Extrication", lanes: [
        { role: "Both LGs", actions: ["Slide spinal board under victim, secure straps", "Apply cervical collar", "Coordinated lift onto deck, maintain spinal alignment"] },
        { role: "Counter Staff", actions: ["Call ambulance immediately", "Prepare route for paramedics"] },
        { role: "SLG", actions: ["Monitor breathing and consciousness", "Prevent movement, reassure victim"] }
      ]},
      { type: "post", title: "Post-Incident", lanes: [ { role: "SLG / LG IC", actions: ["Appendix C with mechanism of injury", "Preserve scene for MSUM/WSH review if applicable", "Team debrief on stabilisation technique"] } ] }
    ]},
  cardiac: { title: "Cardiac Arrest on Deck", sub: "Sudden collapse of patron or staff on pool deck or in gym/MPH support role. Not water-related.",
    phases: [
      { type: "erp", title: "Immediate Response", lanes: [
        { role: "LG (nearest)", actions: ["Confirm unresponsive, no breathing", "Shout for AED and help", "Commence CPR within 30 seconds"] },
        { role: "LG IC", actions: ["Retrieve AED, first aid kit, oxy-viva from softpack", "Attach pads, deliver shock as advised"] },
        { role: "Counter Staff", actions: ["Call 995 and NUS Security", "Clear route for paramedics"] },
        { role: "SLG", actions: ["Take command, ensure pool coverage maintained if possible", "Decide whether to close pool"] }
      ]},
      { type: "post", title: "Post-Incident", lanes: [ { role: "SLG / LG IC", actions: ["Complete Appendix C", "Reset AED, replenish pads and consumables", "Notify NUS/MSUM and support staff welfare"] } ] }
    ]},
  lightning: { title: "Lightning Alert", sub: "Triggered by MSUM alert system or observed strike within 8km. Both pools evacuated.",
    phases: [
      { type: "eap", title: "Activation", lanes: [
        { role: "SLG", actions: ["Confirm alert with MSUM", "Sound evacuation whistle pattern"] },
        { role: "LG / LG IC", actions: ["Clear all bathers from water immediately", "Direct patrons to sheltered zones away from metal fittings"] },
        { role: "Counter Staff", actions: ["Post lightning notice, suspend admissions", "Log alert start time"] }
      ]},
      { type: "eap", title: "All-Clear Protocol", lanes: [ { role: "SLG", actions: ["30-minute wait from last observed strike before reopening", "Log all-clear time and reopen pools"] } ] }
    ]},
  chemical: { title: "Chemical / Water Quality Incident", sub: "Chlorine leak, cloudy water, suspected contamination, or failed water test.",
    phases: [
      { type: "eap", title: "Immediate Action", lanes: [
        { role: "LG", actions: ["Close affected pool immediately", "Evacuate bathers upwind if chlorine odour present", "Rope off area"] },
        { role: "SLG", actions: ["Notify NUS/MSUM and pool plant operator", "Retest water, log parameters"] },
        { role: "Counter Staff", actions: ["Post closure notice", "Divert patrons to unaffected pool if operational"] }
      ]},
      { type: "post", title: "Reopening", lanes: [ { role: "SLG / LG IC", actions: ["Reopen only after MSUM approval and two consecutive clear tests", "Log incident in daily register"] } ] }
    ]},
  fire: { title: "Fire / Building Evacuation", sub: "Fire alarm activation at USC or SRC. Support role to NUS Fire Safety Manager.",
    phases: [
      { type: "eap", title: "Evacuation", lanes: [
        { role: "LG", actions: ["Clear all bathers from water", "Direct patrons to nearest fire exit and assembly point"] },
        { role: "LG IC", actions: ["Sweep changing rooms and toilets", "Assist mobility-impaired patrons"] },
        { role: "Counter Staff", actions: ["Grab attendance register and daily log", "Report to assembly point for headcount"] },
        { role: "SLG", actions: ["Report to NUS Fire Warden", "Confirm all staff and known patrons accounted for"] }
      ]}
    ]},
  missing: { title: "Missing Person Report", sub: "Parent or companion reports a missing child or adult believed to have been at the pool.",
    phases: [
      { type: "eap", title: "Search Activation", lanes: [
        { role: "Counter Staff", actions: ["Take description, last known location, and time", "Alert SLG immediately"] },
        { role: "SLG", actions: ["Immediate visual sweep of all pools (bottom scan)", "Do not delay water search for land search"] },
        { role: "LG / LG IC", actions: ["Split sweep: LG bottom scans pools, LG IC checks changing rooms and deck", "Whistle pattern for pool clearance if bottom scan needed"] }
      ]},
      { type: "post", title: "Escalation", lanes: [ { role: "SLG", actions: ["If not located within 5 minutes, escalate to NUS Security", "Log all steps taken with timestamps"] } ] }
    ]},
  misconduct: { title: "Patron Misconduct", sub: "Non-compliance with pool rules, aggressive behaviour, or unauthorised entry.",
    phases: [
      { type: "psp", title: "Graduated Response", lanes: [
        { role: "LG", actions: ["Verbal warning citing specific rule", "If repeated, second warning with named consequence"] },
        { role: "LG IC / SLG", actions: ["Take over engagement if patron remains non-compliant", "Request patron leave the facility"] },
        { role: "Counter Staff", actions: ["Log incident with time and description", "Contact NUS Security if patron refuses to leave or becomes aggressive"] }
      ]}
    ]}
};

const kpiData = {
  psp: [["Scan cycle", "10 seconds"], ["Recognition to reach", "20 seconds"], ["Perimeter patrol", "Every 15 min"], ["Preventive interventions", "Logged (KPI 3a)"]],
  active: [["Recognition", "10 sec scan"], ["Reach victim", "Within 20 sec"], ["Extrication", "Within 90 sec"]],
  passive: [["Awareness drill standard", "30 sec"], ["Extrication (KPI 2b)", "1 min 30 sec"], ["CPR initiation (KPI 2c)", "30 sec"], ["AED setup", "1 min 30 sec"]],
  swb: [["Recognition (LMC signs)", "Immediate"], ["O2 administration", "15 LPM NRB"], ["Ambulance", "Mandatory"]],
  spinal: [["Stabilisation", "Before extrication"], ["Board application", "In-water"], ["Ambulance", "Mandatory"]],
  cardiac: [["CPR initiation", "30 sec"], ["AED attachment", "90 sec"], ["995 activation", "Immediate"]],
  lightning: [["Pool clearance", "Immediate on alert"], ["All-clear wait", "30 min from last strike"]],
  chemical: [["Pool closure", "Immediate"], ["Reopen criteria", "2 clear tests + MSUM sign-off"]],
  fire: [["Evacuation initiation", "On alarm"], ["Assembly headcount", "Within 5 min"]],
  missing: [["Water bottom scan", "Immediate"], ["Security escalation", "5 min"]],
  misconduct: [["Warning", "First occurrence"], ["Escalation", "Second occurrence"], ["Security involvement", "If refusal or aggression"]]

const equipData = {
  psp: ["Rescue tube (each LG)", "Whistle", "Water test kit", "Daily activity register"],
  active: ["Rescue tube", "First aid kit", "Whistle", "Incident report (Appendix C)"],
  passive: ["Rescue tube", "AED softpack", "Oxy-viva + spare cylinders", "BVM", "Spinal board", "Stretcher", "Walkie-talkie"],
  swb: ["Rescue tube", "Oxy-viva with NRB mask", "BVM", "First aid kit"],
  spinal: ["Spinal board", "Stiff neck collar (adult + child)", "Head immobiliser", "Rescue tube"],
  cardiac: ["AED with adult pads", "Oxy-viva", "BVM", "First aid kit", "Shaver + towel"],
  lightning: ["MSUM alert system", "PA / whistle", "Incident log"],
  chemical: ["Water test kit", "Closure signage", "PPE (gloves, mask)", "MSUM contact list"],
  fire: ["Attendance register", "Assembly point map", "First aid kit (mobile)"],
  missing: ["Walkie-talkie", "Description log form", "Pool bottom scan protocol"],
  misconduct: ["Rule signage reference", "Incident log", "NUS Security contact"]
};

// ===== ANIMATION DATA (all 12 scenarios) =====
// Keyframe format: [time_seconds, x, y]
const anim = {
  psp: {
    duration: 180,
    actors: [
      { role: 'SLG', kf: [[0,100,45],[60,100,45],[80,250,340],[110,250,340],[140,100,45],[180,100,45]] },
      { role: 'LGIC', kf: [[0,630,120],[30,630,300],[60,150,300],[90,150,120],[120,630,120],[150,630,300],[180,630,300]] },
      { role: 'LG', kf: [[0,555,120],[45,555,122],[90,555,118],[135,555,122],[180,555,120]] },
      { role: 'CS', kf: [[0,730,45],[100,730,45],[110,730,60],[125,730,45],[180,730,45]] },
      { role: 'P', kf: [[0,-30,-30],[40,650,340],[60,500,340],[70,400,340],[80,400,340],[100,350,340],[130,300,340],[180,280,340]] }
    ],
    events: [
      [0, "Baseline surveillance. Full staffing in position."],
      [30, "LG IC begins scheduled 15-minute perimeter patrol."],
      [50, "LG on M1 chair maintains 10-second scan cycle."],
      [70, "Patron enters deck moving quickly."],
      [75, "Patron begins running near pool edge."],
      [80, "LG issues verbal warning: no running on wet deck (KPI 3a preventive intervention)."],
      [85, "Patron complies and slows to walking pace."],

const ANIM_DEFAULT_SPEED = 2;

// ===== RENDER =====
function renderScenario(key) {
  const s = scenarios[key];
  const main = document.getElementById('main');
  const aside = document.getElementById('aside');

  let html = '<div class="scenario-title">' + s.title + '</div><div class="scenario-sub">' + s.sub + '</div>';
  html += renderAnimationBlock(key);
  s.phases.forEach(function(p) {
    html += '<div class="phase"><div class="phase-header"><span class="phase-badge ' + p.type + '">' + p.type.toUpperCase() + '</span><span class="phase-title">' + p.title + '</span></div><div class="lanes">';
    p.lanes.forEach(function(l) {
      html += '<div class="lane-role">' + l.role + '</div><div class="lane-actions"><ol>';
      l.actions.forEach(function(a) { html += '<li>' + a + '</li>'; });
      html += '</ol></div>';
    });
    html += '</div></div>';
  });
  main.innerHTML = html;

  initAnimation(key);

  var asideHtml = '<div class="aside-block"><h3>KPI Timings</h3>';
  kpiData[key].forEach(function(row) { asideHtml += '<div class="kpi-row"><span class="kpi-label">' + row[0] + '</span><span class="kpi-value">' + row[1] + '</span></div>'; });
  asideHtml += '</div><div class="aside-block"><h3>Equipment Deployed</h3><ul class="equip-list">';
  equipData[key].forEach(function(e) { asideHtml += '<li>' + e + '</li>'; });
  asideHtml += '</ul></div><div class="aside-block"><h3>Reference</h3><div style="font-size:12px;color:#4b5563;">Appendix C: Incident Report Form<br>Appendix H/I/J: Equipment Checklists<br>Requirement Spec Clause 4.4<br>KPI matrix (Vigilance, Response, Prevention)</div></div>';
  aside.innerHTML = asideHtml;
}

function renderAnimationBlock(key) {
  var legendHtml = '';
  var uniqueRoles = {};
  anim[key].actors.forEach(function(a) { uniqueRoles[a.role] = true; });
  Object.keys(uniqueRoles).forEach(function(r) {
    var full = { SLG: 'SLG (Senior Lifeguard)', LGIC: 'LG IC (Shift Team Lead)', LG: 'LG (Duty Lifeguard)', CS: 'CS (Counter Staff)', V: 'Victim', P: 'Patron', P2: 'Patron' }[r];
    legendHtml += '<div class="legend-item"><span class="legend-dot" style="background:' + ROLE[r].color + '"></span>' + full + '</div>';
  });

  return '<div class="anim-container">' +
    '<div class="anim-header">' +
      '<div class="anim-title">Animated ERP Sequence &nbsp;·&nbsp; USC Indoor Competition Pool</div>' +
      '<div class="anim-controls">' +
        '<button class="anim-btn" id="playBtn">Play</button>' +
        '<button class="anim-btn secondary" id="resetBtn">Reset</button>' +
        '<select id="speedSel"><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option><option value="8">8x</option></select>' +
      '</div>' +
    '</div>' +
    '<div class="anim-stage">' +
      '<svg viewBox="0 0 800 460" preserveAspectRatio="xMidYMid meet">' +
        '<rect x="0" y="0" width="800" height="460" fill="#e5e7eb"/>' +

        '<rect x="280" y="360" width="220" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3"/>' +

    '</div>' +
    '<div class="legend">' + legendHtml + '</div>' +
    '<div class="kpi-strip" id="kpiStrip"></div>' +
    '<div class="anim-log" id="animLog"><div class="log-line"><span class="log-time">READY</span>Press play to run the sequence.</div></div>' +
  '</div>';
}

// ===== ANIMATION ENGINE =====
var animState = { playing: false, t: 0, lastFrame: 0, rafId: null, lastLog: -1, speed: ANIM_DEFAULT_SPEED, scenario: null };

function initAnimation(key) {
  animState.scenario = key;
  animState.t = 0;
  animState.lastLog = -1;
  animState.playing = false;
  if (animState.rafId) cancelAnimationFrame(animState.rafId);

  var actorGroup = document.getElementById('actorGroup');
  actorGroup.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';

  anim[key].actors.forEach(function(a, i) {
    var role = ROLE[a.role];
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('id', 'actor-' + i);
    var p = a.kf[0];
    g.setAttribute('transform', 'translate(' + p[1] + ',' + p[2] + ')');
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('r', '16');
    c.setAttribute('fill', role.color);
    c.setAttribute('stroke', 'white');
    c.setAttribute('stroke-width', '2');
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dy', '4');
    t.setAttribute('font-size', role.font);
    t.setAttribute('font-weight', '700');
    t.setAttribute('fill', role.tc);
    t.textContent = role.label;
    g.appendChild(c); g.appendChild(t);
    actorGroup.appendChild(g);
  });

  renderKpiStrip(0);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('resetBtn').addEventListener('click', resetAnim);
  document.getElementById('speedSel').addEventListener('change', function(e) { animState.speed = parseFloat(e.target.value); });
}

function interpolatePosition(kf, t) {
  if (t <= kf[0][0]) return { x: kf[0][1], y: kf[0][2] };
  if (t >= kf[kf.length - 1][0]) return { x: kf[kf.length - 1][1], y: kf[kf.length - 1][2] };
  for (var i = 0; i < kf.length - 1; i++) {
    if (t >= kf[i][0] && t <= kf[i + 1][0]) {
      var span = kf[i + 1][0] - kf[i][0];
      var p = span === 0 ? 0 : (t - kf[i][0]) / span;
      return { x: kf[i][1] + (kf[i + 1][1] - kf[i][1]) * p, y: kf[i][2] + (kf[i + 1][2] - kf[i][2]) * p };
    }
  }
  return { x: kf[0][1], y: kf[0][2] };
}

function formatTime(t) {
  var m = Math.floor(t / 60), s = Math.floor(t % 60);
  return 'T + ' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function renderKpiStrip(t) {
  var strip = document.getElementById('kpiStrip');
  if (!strip) return;
  var kpis = anim[animState.scenario].kpis;
  strip.innerHTML = kpis.map(function(k) {
    var hit = t >= k.hitAt;
    return '<div class="kpi-item ' + (hit ? 'hit' : '') + '">' +
      '<div class="kpi-item-label">' + k.label + '</div>' +
      '<div style="color:#4b5563;">Target: ' + k.target + '</div>' +
      '<div style="color:#4b5563;">' + (hit ? '\u2713 Hit at ' + formatTime(k.hitAt).replace('T + ', '') : 'Pending') + '</div>' +
    '</div>';
  }).join('');
}

function updateLog(t) {
  var log = document.getElementById('animLog');
  if (!log) return;
  var events = anim[animState.scenario].events;
  for (var i = animState.lastLog + 1; i < events.length; i++) {
    if (t >= events[i][0]) {
      var div = document.createElement('div');
      div.className = 'log-line';
      div.innerHTML = '<span class="log-time">' + formatTime(events[i][0]).replace('T + ', '') + '</span>' + events[i][1];
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      animState.lastLog = i;
    } else break;
  }
}

function tick(now) {
  if (!animState.playing) return;
  var dt = (now - animState.lastFrame) / 1000;
  animState.lastFrame = now;
  animState.t += dt * animState.speed;
  var dur = anim[animState.scenario].duration;
  if (animState.t >= dur) {
    animState.t = dur;
    animState.playing = false;
    document.getElementById('playBtn').textContent = 'Play';
  }
  var clock = document.getElementById('clock');
  if (clock) clock.textContent = formatTime(animState.t);
  anim[animState.scenario].actors.forEach(function(a, i) {
    var el = document.getElementById('actor-' + i);
    if (!el) return;
    var pos = interpolatePosition(a.kf, animState.t);
    el.setAttribute('transform', 'translate(' + pos.x + ',' + pos.y + ')');
  });
  renderKpiStrip(animState.t);
  updateLog(animState.t);
  if (animState.playing) animState.rafId = requestAnimationFrame(tick);
}

function togglePlay() {
  if (animState.playing) {
    animState.playing = false;
    if (animState.rafId) cancelAnimationFrame(animState.rafId);
    document.getElementById('playBtn').textContent = 'Play';
  } else {
    if (animState.t >= anim[animState.scenario].duration) resetAnim();
    animState.playing = true;
    animState.lastFrame = performance.now();
    document.getElementById('playBtn').textContent = 'Pause';
    animState.rafId = requestAnimationFrame(tick);
  }
}

function resetAnim() {
  animState.playing = false;
  if (animState.rafId) cancelAnimationFrame(animState.rafId);
  animState.t = 0;
  animState.lastLog = -1;
  var pb = document.getElementById('playBtn');
  if (pb) pb.textContent = 'Play';
  var cl = document.getElementById('clock');
  if (cl) cl.textContent = 'T + 00:00';
  var log = document.getElementById('animLog');
  if (log) log.innerHTML = '<div class="log-line"><span class="log-time">READY</span>Press play to run the sequence.</div>';
  anim[animState.scenario].actors.forEach(function(a, i) {
    var el = document.getElementById('actor-' + i);
    if (!el) return;
    var p = a.kf[0];
    el.setAttribute('transform', 'translate(' + p[1] + ',' + p[2] + ')');
  });
  renderKpiStrip(0);
}

// ===== INIT =====
document.querySelectorAll('.scenario-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.scenario-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    renderScenario(btn.dataset.scenario);
  });
});

renderScenario('psp');
</script>
