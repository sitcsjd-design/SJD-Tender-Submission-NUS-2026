<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SJD Unified PSP / EAP / ERP Scenario Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f6f9; color: #1a2332; line-height: 1.45; }
  .header { background: #1F3864; color: white; padding: 20px 32px; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .layout { display: grid; grid-template-columns: 260px 1fr 300px; gap: 0; min-height: calc(100vh - 82px); }
  .sidebar { background: white; border-right: 1px solid #e1e5eb; padding: 20px 0; overflow-y: auto; }
  .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; padding: 0 20px 10px; font-weight: 600; }
  .scenario-group { margin-bottom: 18px; }
  .scenario-btn { display: block; width: 100%; text-align: left; padding: 10px 20px; background: none; border: none; border-left: 3px solid transparent; cursor: pointer; font-size: 13px; color: #1a2332; transition: all 0.15s; }
  .scenario-btn:hover { background: #f4f6f9; }
  .scenario-btn.active { background: #eef2f8; border-left-color: #1F3864; font-weight: 600; }
  .scenario-btn .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; font-weight: 600; }
  .scenario-btn .anim-flag { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-left: 4px; font-weight: 600; background: #10b981; color: white; }
  .tag.psp { background: #dbeafe; color: #1e40af; }
  .tag.eap { background: #fef3c7; color: #92400e; }
  .tag.erp { background: #fee2e2; color: #991b1b; }
  .main { padding: 24px 32px; overflow-y: auto; }
  .scenario-title { font-size: 20px; font-weight: 600; color: #1F3864; }
  .scenario-sub { font-size: 13px; color: #6b7280; margin-top: 4px; margin-bottom: 20px; }

  .anim-container { background: white; border: 1px solid #e1e5eb; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
  .anim-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .anim-title { font-size: 14px; font-weight: 600; color: #1F3864; }
  .anim-controls { display: flex; gap: 8px; align-items: center; }
  .anim-btn { padding: 6px 14px; background: #1F3864; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .anim-btn:hover { background: #2a4a7a; }
  .anim-btn.secondary { background: #e5e7eb; color: #1a2332; }
  .anim-stage { position: relative; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; }
  .anim-stage svg { display: block; width: 100%; height: auto; }
  .clock-overlay { position: absolute; top: 10px; right: 12px; background: rgba(31, 56, 100, 0.95); color: white; padding: 6px 12px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.05em; }
  .kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .kpi-item { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 4px; padding: 8px 10px; font-size: 11px; }
  .kpi-item.hit { background: #d1fae5; border-color: #10b981; }
  .kpi-item.pending { color: #6b7280; }
  .kpi-item-label { font-weight: 600; color: #1F3864; margin-bottom: 2px; }
  .kpi-item.hit .kpi-item-label { color: #065f46; }
  .anim-log { margin-top: 12px; background: #1a2332; color: #d1d5db; border-radius: 4px; padding: 10px 14px; font-family: 'Courier New', monospace; font-size: 11px; max-height: 100px; overflow-y: auto; }
  .anim-log .log-line { padding: 2px 0; }
  .anim-log .log-time { color: #60a5fa; font-weight: 700; margin-right: 8px; }
  .anim-placeholder { padding: 30px; text-align: center; color: #6b7280; font-size: 13px; background: #f8fafc; border-radius: 6px; }

  .phase { margin-bottom: 22px; }
  .phase-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .phase-badge { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 3px; font-weight: 700; letter-spacing: 0.05em; }
  .phase-badge.psp { background: #1e40af; color: white; }
  .phase-badge.eap { background: #b45309; color: white; }
  .phase-badge.erp { background: #991b1b; color: white; }
  .phase-badge.post { background: #065f46; color: white; }
  .phase-title { font-size: 14px; font-weight: 600; }
  .lanes { display: grid; grid-template-columns: 120px 1fr; background: white; border: 1px solid #e1e5eb; border-radius: 6px; overflow: hidden; }
  .lane-role { padding: 12px; background: #f8fafc; border-right: 1px solid #e1e5eb; border-bottom: 1px solid #e1e5eb; font-size: 12px; font-weight: 600; color: #1F3864; display: flex; align-items: center; }
  .lane-actions { padding: 12px; border-bottom: 1px solid #e1e5eb; font-size: 13px; }
  .lane-role:last-of-type, .lane-actions:last-of-type { border-bottom: none; }
  .lane-actions ol { padding-left: 18px; }
  .lane-actions li { margin-bottom: 4px; }
  .aside { background: #fafbfc; border-left: 1px solid #e1e5eb; padding: 20px; overflow-y: auto; }
  .aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; margin-bottom: 10px; font-weight: 600; }
  .aside-block { background: white; border: 1px solid #e1e5eb; border-radius: 6px; padding: 12px; margin-bottom: 14px; }
  .kpi-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px dashed #e1e5eb; }
  .kpi-row:last-child { border-bottom: none; }
  .kpi-label { color: #4b5563; }
  .kpi-value { font-weight: 600; color: #1F3864; }
  .equip-list { list-style: none; }
  .equip-list li { padding: 4px 0; font-size: 12px; color: #4b5563; }
  .equip-list li::before { content: "▸ "; color: #1F3864; font-weight: 600; }

  .actor { transition: transform 0.5s ease-in-out; }
  .actor.fast { transition: transform 0.2s ease-in-out; }
  .actor circle { transition: fill 0.3s; }
  .actor.alert circle { fill: #fbbf24 !important; }
  .cpr-pulse { animation: pulse 0.6s infinite; transform-origin: center; }
  .aed-flash { animation: flash 0.4s 3; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  @keyframes flash { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div class="header">
  <h1>SJD Unified PSP / EAP / ERP Scenario Map</h1>
  <p>NUS Aquatic Facilities (USC &amp; UTown) &nbsp;·&nbsp; MSUM/SPORTS/T/2026/01 &nbsp;·&nbsp; 3 LG + 1 CS baseline manning</p>

  <div class="main" id="main"></div>
  <div class="aside" id="aside"></div>
</div>

<script>

  victim: { color: '#facc15', label: 'V', name: 'Victim',
    keyframes: [
      { t: 0, x: 380, y: 200 },     // swimming

      { t: 30, x: 380, y: 240 },    // at bottom
      { t: 55, x: 220, y: 190 },    // being towed

const passiveEvents = [
  { t: 0, text: "Baseline surveillance. Duty LG scanning indoor competition pool from M1 position." },
  { t: 8, text: "Victim submerges silently mid-pool. No struggle observed by other bathers." },
  { t: 20, text: "Duty LG recognises submerged silhouette (within 30 sec KPI 1a)." },
  { t: 22, text: "Three long whistle blasts. Duty LG signals victim location and enters water." },
  { t: 30, text: "Duty LG reaches victim at pool bottom." },
  { t: 45, text: "Co-Duty LG clears bathers, moves to softpack station." },
  { t: 55, text: "Duty LG surfaces with victim, tows to nearest edge." },
  { t: 65, text: "Co-Duty LG retrieves softpack (AED, oxy-viva, BVM)." },
  { t: 90, text: "Extrication complete on deck (KPI 2b: within 90 sec). Primary survey begins." },
  { t: 95, text: "Counter Staff activates 995 ambulance via NUS Security." },
  { t: 120, text: "CPR initiated (KPI 2c: within 30 sec of extrication). 30:2 ratio." },
  { t: 150, text: "AED pads attached by Co-Duty LG." },
  { t: 180, text: "AED analysis. Shock advised. Clear victim." },
  { t: 185, text: "First shock delivered. CPR resumed." },
  { t: 240, text: "Rescuer swap. Second CPR cycle." },
  { t: 260, text: "Second AED analysis. Continued protocol." },
  { t: 290, text: "Paramedics arrive. Handover: shocks given, CPR duration, patient status." }
];

const passiveKpis = [
  { label: "Recognition", target: "30 sec", hitAt: 20 },
  { label: "Extrication", target: "90 sec", hitAt: 90 },
  { label: "CPR initiation", target: "+30 sec", hitAt: 120 },
  { label: "AED attached", target: "+90 sec", hitAt: 150 }
];

const ANIM_DURATION = 300; // seconds (5:00)

// ===== RENDER =====
function renderScenario(key) {
  const s = scenarios[key];
  const main = document.getElementById('main');
  const aside = document.getElementById('aside');

  let html = `<div class="scenario-title">${s.title}</div><div class="scenario-sub">${s.sub}</div>`;

  if (s.hasAnimation) {
    html += renderAnimationBlock();
  } else if (key !== 'psp') {
    html += `<div class="anim-container"><div class="anim-placeholder">Animated sequence for this scenario in development. Currently the Passive Drowning scenario is the reference build.</div></div>`;
  }

  s.phases.forEach(p => {
    html += `<div class="phase"><div class="phase-header"><span class="phase-badge ${p.type}">${p.type.toUpperCase()}</span><span class="phase-title">${p.title}</span></div><div class="lanes">`;
    p.lanes.forEach(l => {
      html += `<div class="lane-role">${l.role}</div><div class="lane-actions"><ol>`;
      l.actions.forEach(a => { html += `<li>${a}</li>`; });
      html += `</ol></div>`;
    });
    html += `</div></div>`;
  });
  main.innerHTML = html;

  if (s.hasAnimation) initAnimation();

  let asideHtml = `<div class="aside-block"><h3>KPI Timings</h3>`;
  kpiData[key].forEach(([label, val]) => { asideHtml += `<div class="kpi-row"><span class="kpi-label">${label}</span><span class="kpi-value">${val}</span></div>`; });
  asideHtml += `</div><div class="aside-block"><h3>Equipment Deployed</h3><ul class="equip-list">`;
  equipData[key].forEach(e => { asideHtml += `<li>${e}</li>`; });
  asideHtml += `</ul></div><div class="aside-block"><h3>Reference</h3><div style="font-size:12px;color:#4b5563;">Appendix C: Incident Report Form<br>Appendix H/I/J: Equipment Checklists<br>Requirement Spec Clause 4.4<br>KPI matrix (Vigilance, Response, Prevention)</div></div>`;
  aside.innerHTML = asideHtml;
}

function renderAnimationBlock() {

          <button class="anim-btn" id="playBtn">▶ Play</button>
          <button class="anim-btn secondary" id="resetBtn">Reset</button>

      <div class="anim-stage">

          <!-- SLG Office -->
          <rect x="60" y="15" width="80" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
          <text x="100" y="45" text-anchor="middle" font-size="10" fill="#78350f">SLG Office</text>
          <!-- Counter -->
          <rect x="680" y="15" width="100" height="50" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
          <text x="730" y="45" text-anchor="middle" font-size="10" fill="#5b21b6">Counter</text>
          <!-- Phone -->
          <circle cx="770" cy="55" r="4" fill="#7c3aed"/>

          <text x="770" y="195" text-anchor="end" font-size="9" fill="#64748b">↗ Ambulance ingress</text>
          <!-- Actors group (populated by JS) -->
          <g id="actorGroup"></g>
        </svg>

    </div>

}

// ===== ANIMATION ENGINE =====
let animState = { playing: false, t: 0, startTime: 0, rafId: null };

function initAnimation() {
  const actorGroup = document.getElementById('actorGroup');
  actorGroup.innerHTML = '';
  Object.entries(passiveActors).forEach(([key, actor]) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('id', `actor-${key}`);
    g.setAttribute('class', 'actor');
    const pos = actor.keyframes[0];
    g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
    g.innerHTML = `
      <circle r="14" fill="${actor.color}" stroke="white" stroke-width="2"/>
      <text text-anchor="middle" dy="4" font-size="12" font-weight="700" fill="white">${actor.label}</text>
    `;
    actorGroup.appendChild(g);
  });

  renderKpiStrip(0);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('resetBtn').addEventListener('click', resetAnim);
}

function interpolatePosition(actor, t) {
  const kfs = actor.keyframes;
  if (t <= kfs[0].t) return { x: kfs[0].x, y: kfs[0].y };
  if (t >= kfs[kfs.length - 1].t) return { x: kfs[kfs.length - 1].x, y: kfs[kfs.length - 1].y };
  for (let i = 0; i < kfs.length - 1; i++) {
    if (t >= kfs[i].t && t <= kfs[i + 1].t) {
      const span = kfs[i + 1].t - kfs[i].t;
      const progress = span === 0 ? 0 : (t - kfs[i].t) / span;
      return {
        x: kfs[i].x + (kfs[i + 1].x - kfs[i].x) * progress,
        y: kfs[i].y + (kfs[i + 1].y - kfs[i].y) * progress
      };
    }
  }
  return { x: kfs[0].x, y: kfs[0].y };
}

function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `T + ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function renderKpiStrip(currentT) {
  const strip = document.getElementById('kpiStrip');
  if (!strip) return;
  strip.innerHTML = passiveKpis.map(k => {
    const hit = currentT >= k.hitAt;
    return `<div class="kpi-item ${hit ? 'hit' : 'pending'}">
      <div class="kpi-item-label">${k.label}</div>
      <div>Target: ${k.target}</div>
      <div>${hit ? '✓ Hit at ' + formatTime(k.hitAt).replace('T + ', '') : 'Pending'}</div>
    </div>`;
  }).join('');
}

let lastLoggedIndex = -1;
function updateLog(t) {
  const log = document.getElementById('animLog');
  if (!log) return;
  for (let i = lastLoggedIndex + 1; i < passiveEvents.length; i++) {
    if (t >= passiveEvents[i].t) {
      const div = document.createElement('div');
      div.className = 'log-line';
      div.innerHTML = `<span class="log-time">${formatTime(passiveEvents[i].t).replace('T + ', '')}</span>${passiveEvents[i].text}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      lastLoggedIndex = i;
    } else {
      break;
    }
  }
}

function frame(now) {
  if (!animState.playing) return;
  const elapsed = (now - animState.startTime) / 1000;
  animState.t = elapsed;
  if (animState.t >= ANIM_DURATION) {
    animState.t = ANIM_DURATION;
    animState.playing = false;
    document.getElementById('playBtn').textContent = '▶ Play';
  }
  document.getElementById('clock').textContent = formatTime(animState.t);
  Object.entries(passiveActors).forEach(([key, actor]) => {
    const el = document.getElementById(`actor-${key}`);
    if (!el) return;
    const pos = interpolatePosition(actor, animState.t);
    el.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
    // Alert flash for Duty LG at recognition
    if (key === 'dutyLG' && animState.t >= 20 && animState.t <= 25) {
      el.classList.add('alert');
    } else {
      el.classList.remove('alert');
    }
  });
  renderKpiStrip(animState.t);
  updateLog(animState.t);
  if (animState.playing) animState.rafId = requestAnimationFrame(frame);
}

function togglePlay() {
  if (animState.playing) {
    animState.playing = false;
    if (animState.rafId) cancelAnimationFrame(animState.rafId);
    document.getElementById('playBtn').textContent = '▶ Play';
  } else {
    if (animState.t >= ANIM_DURATION) resetAnim();
    animState.playing = true;
    animState.startTime = performance.now() - animState.t * 1000;
    document.getElementById('playBtn').textContent = '❚❚ Pause';
    animState.rafId = requestAnimationFrame(frame);
  }
}

function resetAnim() {
  animState.playing = false;
  if (animState.rafId) cancelAnimationFrame(animState.rafId);
  animState.t = 0;
  lastLoggedIndex = -1;
  document.getElementById('playBtn').textContent = '▶ Play';
  document.getElementById('clock').textContent = 'T + 00:00';
  document.getElementById('animLog').innerHTML = '<div class="log-line"><span class="log-time">READY</span>Press play to run the sequence.</div>';
  Object.entries(passiveActors).forEach(([key, actor]) => {
    const el = document.getElementById(`actor-${key}`);
    if (!el) return;
    const pos = actor.keyframes[0];
    el.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
    el.classList.remove('alert');
  });
  renderKpiStrip(0);
}

// ===== INIT =====
document.querySelectorAll('.scenario-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    resetAnim();
    renderScenario(btn.dataset.scenario);
  });
});

renderScenario('psp');
</script>
